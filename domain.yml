version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - player_stats
  - ask_score
  - next_match_schedule

entities:
  - player
  - team

actions:
  - action_show_league_matches
  - action_show_player_stats
  - action_show_match_score
  - action_next_match_schedule

slots:
  player:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: player
  team:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: team

responses:
  utter_greet:
  - text: "Hey! I am Goalie, your football match assistant. How can I help you?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
